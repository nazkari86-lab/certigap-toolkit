name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show toolchain
        run: |
          python --version
          g++ --version

      - name: Build C++ core
        env:
          PYTHONPATH: .
        run: python build_cpp_core.py

      - name: Run unit tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v

      - name: Generate benchmark artifacts
        env:
          PYTHONPATH: .
        run: |
          python generate_results.py
          python generate_speed_quality.py --mode fast
          python generate_counterexamples.py --mode fast
          python generate_figures.py

      - name: Verify public examples
        env:
          PYTHONPATH: .
        run: |
          python examples/skewed_kv_lookup.py
          python examples/static_hot_cold_catalog.py
          python examples/read_heavy_embedded_index.py
