name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show toolchain
        run: |
          python --version
          g++ --version

      - name: Build C++ core
        env:
          PYTHONPATH: .
        run: python build_cpp_core.py

      - name: Run unit tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v

      - name: Generate benchmark artifacts
        env:
          PYTHONPATH: .
        run: |
          python generate_results.py
          python generate_speed_quality.py --mode fast
          python generate_counterexamples.py --mode fast
          python generate_proof_artifacts.py
          python generate_autodro_benchmark.py
          python generate_direct_tv_validation.py
          python generate_uncertainty_validation.py
          python generate_online_adaptation.py
          python generate_autoindex_validation.py
          python generate_compiler_integration_validation.py
          python generate_adaptive_validation.py
          python generate_synthesis_validation.py
          python generate_figures.py

      - name: Verify committed scientific artifacts
        env:
          PYTHONPATH: .
        run: python verify_artifacts.py

      - name: Verify public examples
        env:
          PYTHONPATH: .
        run: |
          python examples/skewed_kv_lookup.py
          python examples/static_hot_cold_catalog.py
          python examples/read_heavy_embedded_index.py
          python examples/autodro_catalog.py
          python examples/certified_autoindex.py

      - name: Build installable wheel
        run: python -m pip wheel . --no-deps --wheel-dir /tmp/certigap-wheel

      - name: Build generated CMake example
        env:
          PYTHONPATH: .
        run: |
          cmake -S examples/cmake_autoindex -B /tmp/certigap-cmake
          cmake --build /tmp/certigap-cmake --parallel 2
          /tmp/certigap-cmake/certigap_autoindex_example

      - name: Build standalone header target
        run: |
          cmake -S . -B /tmp/certigap-header -DCERTIGAP_BUILD_EXAMPLES=ON
          cmake --build /tmp/certigap-header --parallel 2
          /tmp/certigap-header/certigap_online_example
          cmake --install /tmp/certigap-header --prefix /tmp/certigap-install
