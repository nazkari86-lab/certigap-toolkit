name: Paper

on:
  push:
    branches: ["main"]
    paths:
      - "paper/**"
      - ".github/workflows/paper.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "paper/**"
      - ".github/workflows/paper.yml"

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile manuscript
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: paper
      - name: Upload manuscript PDF
        uses: actions/upload-artifact@v4
        with:
          name: certigap-paper
          path: paper/main.pdf
