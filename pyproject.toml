[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "certigap-toolkit"
version = "1.7.0"
description = "Certified workload-adaptive index compilation and robust partial search"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Dulat Nurlanuly"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: C++",
  "Topic :: Scientific/Engineering",
]

[project.scripts]
certigap-compile = "certigap.compiler:main"
certigap-calibrate = "certigap.hardware:main"

[tool.setuptools.packages.find]
include = ["certigap*"]

[tool.setuptools.data-files]
"include/certigap" = [
  "cpp/certigap.hpp",
  "cpp/certigap_adaptive.hpp",
  "cpp/certigap_autoindex.hpp",
  "cpp/certigap_synth.hpp",
]
"share/certigap/schemas" = ["schemas/certigap_compile_input_v1.schema.json"]
"share/certigap/tools" = ["cpp/hardware_calibration.cpp"]
