[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "certigap-toolkit"
version = "1.10.1"
description = "Certified workload-adaptive index compilation and robust partial search"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Dulat Nurlanuly"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: C++",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dev = [
  "build==1.3.0",
  "ruff==0.15.18",
]

[project.scripts]
certigap = "certigap.cli:main"
certigap-compile = "certigap.compiler:main"
certigap-calibrate = "certigap.hardware:main"

[tool.setuptools.packages.find]
include = ["certigap*"]

[tool.setuptools.data-files]
"include/certigap" = [
  "cpp/certigap.hpp",
  "cpp/certigap_adaptive.hpp",
  "cpp/certigap_autoindex.hpp",
  "cpp/certigap_synth.hpp",
]
"share/certigap/schemas" = ["schemas/certigap_compile_input_v1.schema.json"]
"share/certigap/tools" = ["cpp/hardware_calibration.cpp"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
