[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "certigap-toolkit"
version = "0.9.0"
description = "Budgeted robust prefix search with executable interval fallbacks"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Dulat Nurlanuly"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: C++",
  "Topic :: Scientific/Engineering",
]

[tool.setuptools.packages.find]
include = ["certigap*"]
